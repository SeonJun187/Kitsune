<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Overlay - Starting Demonic Fox</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: 
         - Cinzel Decorative: Main titles (Dark fantasy, epic anime)
         - Cormorant Garamond: Subtitles (Poetic, delicate, calligraphic)
         - Montserrat: UI and Messages (Clean, cinematic, modern)
    -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. VARIABLES AND THEME (DEMONIC FOX / DARK SAKURA)
           ========================================================================== */
        :root {
            --fox-white: #f8f9fa; 
            --fox-pink: #ffb7c5;
            --fox-crimson: #d90429;
            --fox-blood: #8a031a;
            --fox-gold: #ffd166;
            
            --magic-glow: rgba(217, 4, 41, 0.5);
            --magic-glow-strong: rgba(217, 4, 41, 0.8);
            
            --dark-void: rgba(10, 0, 2, 0.95);
            --dark-glass: rgba(20, 0, 5, 0.65);
            --panel-border: rgba(255, 183, 197, 0.15);
            
            --font-title: 'Cinzel Decorative', serif;
            --font-subtitle: 'Cormorant Garamond', serif;
            --font-ui: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #030001;
            color: #ffffff;
            font-family: var(--font-ui);
        }

        /* ==========================================================================
           2. BACKGROUND VIDEO SYSTEM (SINGLE LOOP)
           ========================================================================== */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            visibility: hidden;
        }

        .video-background.active {
            z-index: 2;
            opacity: 1;
            visibility: visible;
        }

        /* ==========================================================================
           3. SHADOWS AND LIGHTING (CENTERED DESIGN)
           ========================================================================== */
        .center-shadow {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at center, 
                rgba(10, 0, 2, 0.75) 0%, 
                rgba(20, 2, 5, 0.4) 40%, 
                transparent 80%
            );
            z-index: 1;
            pointer-events: none;
        }

        .bottom-vignette {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 25vh;
            background: linear-gradient(to top, rgba(10,0,2,0.9) 0%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        .sunlight-glow {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(ellipse at top left, rgba(255, 209, 102, 0.1), transparent 70%);
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* ==========================================================================
           4. PARTICLE ENGINE
           ========================================================================== */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            pointer-events: none;
        }

        /* ==========================================================================
           5. MAIN INTERFACE (CENTERED LAYOUT)
           ========================================================================== */
        .ui-container {
            position: absolute;
            inset: 0;
            width: 100vw; 
            height: 100vh;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            pointer-events: none;
            text-align: center; 
        }

        .content-stack {
            display: flex;
            flex-direction: column;
            gap: 1.5rem; 
            width: 100%;
            align-items: center;
        }

        .top-indicator {
            position: absolute;
            top: 4rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
            opacity: 0.9;
            z-index: 10;
        }

        /* ==========================================================================
           6. TYPOGRAPHY AND SCALING (CLAMP)
           ========================================================================== */
        .text-clamp-title {
            font-family: var(--font-title);
            font-size: clamp(3rem, 6vw, 6rem);
            line-height: 1.1;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        .text-clamp-sub {
            font-family: var(--font-subtitle);
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-style: italic;
            line-height: 1.2;
            letter-spacing: 0.1em;
        }

        .text-clamp-timer {
            font-family: var(--font-title);
            font-size: clamp(6rem, 12vw, 13rem);
            line-height: 0.9;
            font-weight: 400;
            white-space: nowrap;
        }

        .title-glow {
            text-shadow: 
                0 5px 25px rgba(0, 0, 0, 0.95), 
                0 0 20px var(--magic-glow),
                0 0 45px rgba(217, 4, 41, 0.4);
            color: var(--fox-white);
        }

        .timer-shimmer {
            background: linear-gradient(
                to right, 
                #ffffff 10%, 
                var(--fox-pink) 30%, 
                var(--fox-crimson) 50%, 
                var(--fox-gold) 70%, 
                #ffffff 90%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 8s linear infinite;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.95)) drop-shadow(0 0 35px rgba(217, 4, 41, 0.3));
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .timer-container {
            display: inline-block;
            transform-origin: center center; 
            animation: breathe-timer 8s ease-in-out infinite alternate;
            padding-bottom: 0.5rem;
        }

        @keyframes breathe-timer {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.15); }
        }

        .text-deep-shadow {
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.95), 0 2px 5px rgba(0,0,0,1);
        }

        /* ==========================================================================
           7. DECORATIVE ELEMENTS
           ========================================================================== */
        .magic-line-wrapper {
            width: 100%;
            max-width: 450px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 183, 197, 0.2), transparent);
            position: relative;
            overflow: hidden;
        }

        .magic-line-fill {
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, transparent, var(--fox-crimson), var(--fox-gold), transparent);
            position: absolute;
            left: 0;
            animation: slide-glow-line 3s infinite ease-in-out;
            box-shadow: 0 0 15px var(--fox-crimson);
        }

        @keyframes slide-glow-line {
            0% { left: -40%; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        .pulse-slow {
            animation: pulse-op 3s infinite ease-in-out;
        }

        /* Aesthetic Audio Visualizer */
        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 20px;
        }

        .visualizer-bar {
            width: 3px;
            background-color: var(--fox-crimson);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--magic-glow);
            animation: eq-bounce 1s ease-in-out infinite alternate;
        }

        .visualizer-bar:nth-child(1) { animation-delay: 0.1s; height: 40%; }
        .visualizer-bar:nth-child(2) { animation-delay: 0.3s; height: 80%; }
        .visualizer-bar:nth-child(3) { animation-delay: 0.0s; height: 100%; background-color: var(--fox-gold); box-shadow: 0 0 8px var(--fox-gold); }
        .visualizer-bar:nth-child(4) { animation-delay: 0.4s; height: 60%; }
        .visualizer-bar:nth-child(5) { animation-delay: 0.2s; height: 50%; }

        @keyframes eq-bounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }

        /* ==========================================================================
           8. ENTRANCE ANIMATIONS
           ========================================================================== */
        .fade-in-center {
            animation: fadeInCenter 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInCenter {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================================================
           9. FOOTER AND MESSAGES TICKER
           ========================================================================== */
        .footer-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw; 
            padding: 3rem 4rem; 
            z-index: 10;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        .greeting-ticker-container {
            position: relative;
            height: 3rem;
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
        }

        .greeting-item {
            position: absolute;
            left: 0;
            font-family: var(--font-subtitle); 
            font-style: italic;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            color: var(--fox-pink);
            white-space: nowrap;
            opacity: 0;
            filter: blur(8px);
            transform: translateX(-20px);
            transition: all 2.5s cubic-bezier(0.25, 1, 0.5, 1);
            text-shadow: 0 4px 15px rgba(0,0,0,0.9), 0 0 15px rgba(217, 4, 41, 0.4);
        }

        .greeting-item.active {
            opacity: 1;
            filter: blur(0px);
            transform: translateX(0);
        }

        .greeting-item.exit {
            opacity: 0;
            filter: blur(8px);
            transform: translateX(20px);
        }

        /* ==========================================================================
           10. SETTINGS MODAL STYLING
           ========================================================================== */
        #settings-toggle {
            position: absolute;
            top: 2rem;
            left: 2rem; 
            z-index: 100;
            pointer-events: auto;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0.75rem;
            backdrop-filter: blur(5px);
        }

        #settings-toggle:hover {
            color: white;
            background: rgba(217, 4, 41, 0.2);
            border-color: rgba(217, 4, 41, 0.5);
            transform: rotate(90deg) scale(1.1);
        }

        #settings-modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #settings-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-panel {
            background: var(--dark-glass);
            border: 1px solid var(--panel-border);
            border-radius: 1rem;
            width: 90%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow: hidden;
            font-family: var(--font-ui);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(217, 4, 41, 0.05);
            transform: scale(0.95) translateY(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #settings-modal.show .settings-panel {
            transform: scale(1) translateY(0);
        }

        .form-control {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: white;
            font-family: var(--font-ui);
            font-weight: 400;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--fox-crimson);
            box-shadow: 0 0 15px rgba(217, 4, 41, 0.15);
        }

        .btn-save {
            background: linear-gradient(135deg, var(--fox-crimson), var(--fox-blood));
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(217, 4, 41, 0.3);
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 4, 41, 0.6);
        }
    </style>
</head>
<body>

    <svg style="display:none">

    <!-- VIDEO BACKGROUND (SINGLE VIDEO FOR STARTING) -->
    <div class="video-container">
        <video id="bg-video-1" class="video-background active" src="starting.mp4" muted autoplay loop playsinline preload="auto"></video>
    </div>

    <!-- SHADOWS AND VIGNETTES -->
    <div class="sunlight-glow"></div>
    <div class="center-shadow"></div>
    <div class="bottom-vignette"></div>

    <!-- PARTICLES -->
    <canvas id="particle-canvas"></canvas>

    <!-- TOP INDICATOR (Centered) -->
    <div class="top-indicator fade-in-center font-ui" style="animation-delay: 0.2s;">
        <div class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-pink-200 shadow-[0_0_8px_#fbcfe8]"></span>
        </div>
        <span id="ui-top-status" class="text-[0.65rem] font-light tracking-[0.4em] uppercase text-gray-300">
            Stream Starting
        </span>
    </div>

    <!-- MAIN UI (CENTER ALIGNED) -->
    <div class="ui-container">
        <div class="content-stack fade-in-center">
            
            <h2 id="ui-subtitle" class="text-clamp-sub text-[#ffb7c5] drop-shadow-md">
                The journey begins shortly...
            </h2>
            
            <h1 id="ui-title" class="text-clamp-title title-glow">
                STARTING SOON
            </h1>

            <div class="timer-container">
                <div id="ui-timer" class="text-clamp-timer tabular-nums timer-shimmer">

        </div>

    <!-- FOOTER (SPREAD ACROSS BOTTOM) -->

        <!-- Rotating Greetings (Left) -->
        <div id="greeting-ticker" class="greeting-ticker-container text-deep-shadow">

        <!-- Metrics & Visualizer (Right) -->
        <div class="flex items-center gap-6 text-[0.55rem] md:text-[0.65rem] font-light tracking-[0.3em] uppercase text-gray-300 opacity-80">

                <svg class="w-3 h-3 text-[#d90429] fill-current"><use href="#icon-moon"></use></svg>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal">
        <div class="settings-panel">
            <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">

    <script>
        const STORAGE_KEY = 'kitsuneStartingState_v4_demonic_single';
        const DEFAULT_CONFIG = {
            minutes: 5,
            title: "STARTING SOON",
            subtitle: "The journey begins shortly...",
            finishedText: "The Veil Has Lifted",
            greetings: "Gathering the fox spirits, Sharpening ancestral blades, Waking up the demon fire, Preparing the journey, Cherry blossoms are falling",
            fxPetals: true, fxEmbers: true, fxStars: true
        };

        let streamConfig = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { ...DEFAULT_CONFIG };

        // DOM
        const uiTimer = document.getElementById('ui-timer');
        const greetingTicker = document.getElementById('greeting-ticker');

        // Video Init (Single loop video)
        function initVideo() {
            const bgVideo = document.getElementById('bg-video-1');
            bgVideo.play().catch(e => console.log("Waiting for interaction to play video."));
        }

        // Timer
        class TimerManager {
            constructor() {
                this.interval = null;
                this.remaining = 0;
            }
            start() {
                if (this.interval) clearInterval(this.interval);
                this.remaining = parseInt(streamConfig.minutes) * 60;
                uiTimer.classList.remove('timer-finished');
                this.update();
                this.interval = setInterval(() => {
                    if (this.remaining <= 0) {
                        this.finish();
                        return;
                    }
                    this.remaining--;
                    this.update();
                }, 1000);
            }
            update() {
                const m = Math.floor(this.remaining / 60).toString().padStart(2, '0');
                const s = (this.remaining % 60).toString().padStart(2, '0');
                uiTimer.innerText = `${m}:${s}`;
            }
            finish() {
                clearInterval(this.interval);
                uiTimer.innerText = "00:00";
                uiTimer.classList.add('timer-finished');
                document.getElementById('ui-top-status').innerText = streamConfig.finishedText.toUpperCase();
            }
        }
        const timer = new TimerManager();

        // Ticker for Messages
        class TickerManager {
            constructor() {
                this.idx = 0;
                this.interval = null;
            }
            init() {
                if(this.interval) clearInterval(this.interval);
                greetingTicker.innerHTML = '';
                const texts = streamConfig.greetings.split(',').map(t => t.trim());
                texts.forEach((t, i) => {
                    const el = document.createElement('div');
                    el.className = `greeting-item ${i === 0 ? 'active' : ''}`;
                    el.innerText = `~ ${t} ~`;
                    greetingTicker.appendChild(el);
                });
                this.items = document.querySelectorAll('.greeting-item');
                this.interval = setInterval(() => this.cycle(), 15000);
            }
            cycle() {
                if (this.items.length <= 1) return;
                this.items[this.idx].classList.remove('active');
                this.items[this.idx].classList.add('exit');
                setTimeout(() => {
                    const prev = (this.idx === 0) ? this.items.length - 1 : this.idx - 1;
                    this.items[prev].classList.remove('exit');
                }, 3000);
                this.idx = (this.idx + 1) % this.items.length;
                this.items[this.idx].classList.add('active');
            }
        }
        const ticker = new TickerManager();

        // Demonic Fox Particle System 
        class ParticleSystem {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }
            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            }
            updateAndDraw() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                if (Math.random() > 0.96) this.particles.push(new SakuraPetal(this.width, this.height));
                if (Math.random() > 0.85) this.particles.push(new MagicEmber(this.width, this.height));
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.update();
                    p.draw(this.ctx);
                    if (p.isDead(this.width, this.height)) this.particles.splice(i, 1);
                }
            }
            start() {
                const loop = () => { this.updateAndDraw(); requestAnimationFrame(loop); };
                requestAnimationFrame(loop);
            }
        }

        class SakuraPetal {
            constructor(sw, sh) {
                this.x = Math.random() * (sw + 200) - 100;
                this.y = -50;
                this.vy = Math.random() * 1 + 1.2;
                this.vx = Math.random() * 2 - 1.5;
                this.size = Math.random() * 8 + 4;
                this.color = Math.random() > 0.4 ? 'rgba(217, 4, 41, 0.7)' : 'rgba(255, 183, 197, 0.6)'; 
                this.rot = Math.random() * Math.PI * 2;
                this.spin = Math.random() * 0.05 - 0.025;
            }
            update() { this.y += this.vy; this.x += this.vx; this.rot += this.spin; }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
                ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(this.size, this.size, this.size*2, -this.size, 0, -this.size*2);
                ctx.fillStyle = this.color; ctx.shadowBlur = 5; ctx.shadowColor = 'rgba(217, 4, 41, 0.4)'; ctx.fill(); ctx.restore();
            }
            isDead(w, h) { return this.y > h + 50; }
        }

        class MagicEmber {
            constructor(sw, sh) {
                this.x = Math.random() * sw; 
                this.y = sh + 20;
                this.vy = Math.random() * -2 - 1;
                this.radius = Math.random() * 2 + 1;
                this.alpha = 1;
                const type = Math.random();
                if (type > 0.8) this.color = '#ffd166'; // Gold
                else if (type > 0.4) this.color = '#d90429'; // Crimson
                else this.color = '#8a031a'; // Blood Red
            }
            update() { this.y += this.vy; this.alpha -= 0.005; }
            draw(ctx) {
                if(this.alpha <= 0) return;
                ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = this.color; ctx.shadowBlur = 10; ctx.shadowColor = this.color; ctx.fill(); ctx.restore();
            }
            isDead() { return this.alpha <= 0; }
        }

        const engine = new ParticleSystem('particle-canvas');

        // Modal Logic
        const modal = document.getElementById('settings-modal');
        document.getElementById('settings-toggle').onclick = () => {
            document.getElementById('input-minutes').value = streamConfig.minutes;
            document.getElementById('input-greetings').value = streamConfig.greetings;
            modal.classList.add('show');
        }
        document.getElementById('btn-close-settings').onclick = () => modal.classList.remove('show');
        document.getElementById('btn-save-settings').onclick = () => {
            streamConfig.minutes = document.getElementById('input-minutes').value;
            streamConfig.greetings = document.getElementById('input-greetings').value;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(streamConfig));
            modal.classList.remove('show');
            timer.start();
            ticker.init();
        };

        // Esc key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') modal.classList.remove('show');
        });

        document.addEventListener('DOMContentLoaded', () => {
            initVideo();
            timer.start();
            ticker.init();
            engine.start();
        });
    </script>
</body>
</html>
